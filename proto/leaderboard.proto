syntax = "proto3";

package leaderboard;

// This ensures your generated Go files end up in a /pb directory
option go_package = "./pb";

// The individual record
message PlayerScore {
  string username = 1;
  uint32 rank = 2;
  int64 score = 3;
}

// The wrapper for multiple updates
message LeaderboardUpdateRequest {
  // "repeated" makes this a slice/list in Go
  repeated PlayerScore records = 1;
}

// A simple response to acknowledge receipt
message UpdateResponse {
  bool success = 1;
  string message = 2;
}

service LeaderboardService {
  // This RPC handles both the initial bulk load
  // and any subsequent batch updates.
  rpc UpdateLeaderboard (LeaderboardUpdateRequest) returns (UpdateResponse);
}
